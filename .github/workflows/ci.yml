name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Confirm there are no runtime dependencies
        # The package must import with nothing installed but the dev tools. A stray
        # third-party import would otherwise go unnoticed until someone installs it.
        run: |
          python - <<'PY'
          import importlib.metadata as md
          requires = md.requires("stripboard") or []
          runtime = [r for r in requires if "extra ==" not in r]
          assert not runtime, f"unexpected runtime dependencies: {runtime}"
          print("no runtime dependencies")
          PY
          python -c "import stripboard, stripboard.router; print(stripboard.__version__)"

      - name: Run the fast suite, with coverage
        run: pytest --cov=stripboard --cov-report=term-missing --cov-fail-under=80

      - name: Run the solver tests
        # Deliberately uninstrumented. Coverage instrumentation more than doubles the
        # runtime of these four place->route tests (5s -> 7min for the whole suite) and
        # they add about one percentage point, so measuring them is not worth the wall
        # clock on every push. They still have to pass.
        run: pytest -m slow

      - name: Render the examples
        # An end-to-end check that the packaged library still produces real output.
        run: |
          for f in examples/*.py; do
            echo "--- $f"
            (cd examples && python "$(basename "$f")")
          done
          ls -la examples/*.pdf

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests tools
      - run: mypy

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Confirm package data ships in the wheel
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install --quiet dist/*.whl
          /tmp/check/bin/python - <<'PY'
          from importlib.resources import files
          for pkg, name in (("stripboard.data", "Carrier.scad"),
                            ("stripboard.templates", "board.py.tmpl")):
              assert (files(pkg) / name).is_file(), f"{pkg}/{name} missing from the wheel"
          print("package data present")
          PY
